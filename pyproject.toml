[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chinuuu"
version = "4.0.0"
description = "Local-first personal AI assistant with durable conversational context, recovery diagnostics, Windows automation, local knowledge, voice and productivity"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["local-ai", "ollama", "windows-automation", "personal-assistant", "offline-voice"]
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.8",
    "pywinauto>=0.6.9; platform_system == 'Windows'",
]

[project.scripts]
chinuuu = "chinuuu.cli:main"
chinuuu-gui = "chinuuu.gui:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
windows = [
    "pycaw>=20260926; platform_system == 'Windows'",
    "comtypes>=1.4.10; platform_system == 'Windows'",
    "mss>=10.0.0; platform_system == 'Windows'",
    "Pillow>=11.0.0",
    "winrt-Windows.Devices.Radios>=3.2.1; platform_system == 'Windows'",
]
documents = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
]
voice = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.13.0",
    "numpy>=1.26.0",
    "pyttsx3>=2.98",
]
wakeword = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.22.0",
]
installer = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["chinuuu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
